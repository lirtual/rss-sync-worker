name: Deploy Reeder RC

on:
  push:
    branches:
      - ops/deploy-reeder-rc

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 8bb496011403552e785ea1b834daffdf
      WORKER_NAME: rss-sync-worker
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN_PRIMARY}" ]; then
            echo "CLOUDFLARE_API_TOKEN=${CF_TOKEN_PRIMARY}" >> "${GITHUB_ENV}"
          elif [ -n "${CF_TOKEN_FALLBACK}" ]; then
            echo "CLOUDFLARE_API_TOKEN=${CF_TOKEN_FALLBACK}" >> "${GITHUB_ENV}"
          else
            echo "::error::No CLOUDFLARE_API_TOKEN or CF_API_TOKEN repository secret is configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify release candidate
        run: npm run check

      - name: Upload immutable Worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/worker.js

          metadata="$(jq -nc \
            --arg sha "${GITHUB_SHA}" \
            '{
              main_module:"worker.js",
              compatibility_date:"2026-09-17",
              bindings:[
                {type:"inherit",name:"DAILY_DISPATCH_BUDGET"},
                {type:"inherit",name:"DB"},
                {type:"inherit",name:"PASSWORD"},
                {type:"inherit",name:"REEDER_TRACE"},
                {type:"inherit",name:"REFRESH_QUEUE"},
                {type:"inherit",name:"USERNAME"}
              ],
              annotations:{
                "workers/commit_sha":$sha,
                "workers/message":"Reeder compatibility release candidate"
              }
            }')"

          response="$(curl --fail-with-body -sS \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=${metadata};type=application/json" \
            -F "worker.js=@dist/worker.js;type=application/javascript+module")"

          echo "${response}" | jq -e '.success == true' >/dev/null
          version_id="$(echo "${response}" | jq -r '.result.id')"
          test -n "${version_id}" && test "${version_id}" != "null"
          echo "version_id=${version_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy version at 100 percent
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg version_id "${{ steps.upload.outputs.version_id }}" \
            '{
              strategy:"percentage",
              versions:[{percentage:100,version_id:$version_id}],
              annotations:{
                "workers/message":"Reeder compatibility release candidate",
                "workers/triggered_by":"github-actions"
              }
            }')"

          response="$(curl --fail-with-body -sS \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"

          echo "${response}" | jq -e '.success == true' >/dev/null
          echo "${response}" | jq '{success,result:{id,created_on,strategy,versions,annotations}}'
