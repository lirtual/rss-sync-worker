name: CI

on:
  push:
    branches:
      - main
      - feat/rss-sync-worker-v0.1
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist
          if-no-files-found: error
